# Runs the local e2e suite (packages/libs/workflow/e2e) against the local
# examples app and a Restate server started in Docker. Everything needed
# lives in this repo — no upstream clone, no workbench patching.

name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run e2e suite
        run: ./scripts/e2e.sh

      - name: Generate summary
        if: always()
        run: |
          RESULTS=packages/libs/workflow/e2e-results.json
          OUT=e2e-summary.md
          if [[ ! -s "$RESULTS" ]]; then
            echo "## E2E Test Results" > "$OUT"
            echo "" >> "$OUT"
            echo "E2E run failed before producing test results. [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$OUT"
          else
            TOTAL=$(jq '.numTotalTests' "$RESULTS")
            PASSED=$(jq '.numPassedTests' "$RESULTS")
            FAILED=$(jq '.numFailedTests' "$RESULTS")
            SKIPPED=$(jq '.numPendingTests' "$RESULTS")
            STATUS=$( [[ "$FAILED" == "0" ]] && echo "✅ Passed" || echo "❌ Failed" )
            {
              echo "## E2E Test Results"
              echo ""
              echo "**Status:** $STATUS"
              echo ""
              echo "| Total | Passed | Failed | Skipped |"
              echo "|------:|-------:|-------:|--------:|"
              echo "| $TOTAL | $PASSED | $FAILED | $SKIPPED |"
              if [[ "$FAILED" != "0" ]]; then
                echo ""
                echo "<details><summary>Failed tests</summary>"
                echo ""
                jq -r '.testResults[].assertionResults[] | select(.status=="failed") | "- `" + .fullName + "`"' "$RESULTS"
                echo ""
                echo "</details>"
              fi
              echo ""
              echo "[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            } > "$OUT"
          fi
          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: e2e-test-results
          path: e2e-summary.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            packages/libs/workflow/e2e-results.json
            server-restate.log
            docker-restate.log
          retention-days: 7
          if-no-files-found: ignore
